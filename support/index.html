<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chronix Support / 支持</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a222c;
      --text: #e8eef4;
      --muted: #9aa8b5;
      --accent: #5eb8ff;
      --rule: #2a3542;
    }
    body {
      margin: 0;
      font-family: "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1d2a3a 0%, var(--bg) 55%);
      color: var(--text);
      line-height: 1.65;
    }
    main { max-width: 640px; margin: 0 auto; padding: 56px 20px 80px; }
    .card {
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 28px;
    }
    h1 { margin: 0 0 10px; font-size: 1.75rem; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 14px; }
    a { color: var(--accent); }
    .links { margin-top: 18px; display: grid; gap: 10px; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Chronix Support</h1>
      <p>需要帮助？请通过邮件联系我们。我们通常会在几个工作日内回复。</p>
      <p>Need help with Chronix? Email us and we’ll get back within a few business days.</p>
      <div class="links">
        <a href="mailto:support@fuze.app?subject=Chronix%20Support">support@fuze.app</a>
        <a href="../">Privacy Policy / 隐私政策</a>
      </div>
    </div>
  </main>
</body>
</html>
